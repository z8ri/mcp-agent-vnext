[alembic]
script_location = alembic
prepend_sys_path = .

# 真正连哪个数据库由 alembic/env.py 里读 app.config.get_settings().database_url
# 决定，不在这里写死——跟应用本身共用同一份配置来源（.env / 环境变量），
# 不会出现"迁移脚本连了一个库、应用连了另一个库"这种割裂。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
